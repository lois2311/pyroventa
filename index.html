<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1428" />
    <!-- Tema antes del primer render (sin destello oscuro→claro). Ver src/lib/theme.js -->
    <script>
      try {
        if (localStorage.getItem('pv_theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F8FB')
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VENDRA POS</title>
    <meta name="description" content="Punto de venta para cualquier negocio. Cobra en segundos. By flightdev." />
    <!-- Fuentes: empaquetadas con la app (src/styles/fonts.css), sin Google Fonts.
         QZ Tray: se carga al imprimir (src/lib/printService.js), sin CDN. -->
    <!-- Print styles -->
    <link rel="stylesheet" media="print" href="/print.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/brand/vendra-favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
  </head>
  <body>
    <!-- Pantalla de carga (antes de React). createRoot la reemplaza al montar.
         Estilos en línea: se pinta antes de que llegue el CSS de la app. -->
    <div id="root">
      <div role="status" aria-label="Cargando VENDRA POS" style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0A1428">
        <img src="/brand/vendra-with-endorsement.svg" alt="" width="280" height="72" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
