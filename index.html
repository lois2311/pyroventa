<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <!-- Tema antes del primer render (sin destello oscuro→claro). Ver src/lib/theme.js -->
    <script>
      try {
        if (localStorage.getItem('pv_theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9e9ec')
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PyroVenta — Control de Ventas</title>
    <meta name="description" content="Sistema de control de ventas para establecimientos pirotécnicos" />
    <!-- Fuentes: empaquetadas con la app (src/styles/fonts.css), sin Google Fonts.
         QZ Tray: se carga al imprimir (src/lib/printService.js), sin CDN. -->
    <!-- Print styles -->
    <link rel="stylesheet" media="print" href="/print.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎆</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
